name: Underdog-bias fix backtest

on:
  workflow_dispatch:
  push:
    branches: ['fix/**']
    paths:
      - 'model_v12.py'
      - 'gameweek_rankings.py'
      - 'bias_fix_backtest.py'
      - 'config.yaml'
      - '.github/workflows/bias-fix-backtest.yml'

permissions:
  contents: write

concurrency:
  group: bias-fix-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tabulate pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Run baseline vs fixed walk-forward backtest
        run: python bias_fix_backtest.py

      - name: Publish summary to this branch (never main)
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/bias_fix_backtest_summary.csv
          if git diff --cached --quiet; then
            echo "No summary changes"
          else
            git commit -m "data: publish bias fix backtest summary [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bias-fix-backtest
          path: data/processed/bias_fix_backtest_*.csv
          if-no-files-found: warn
          retention-days: 30
