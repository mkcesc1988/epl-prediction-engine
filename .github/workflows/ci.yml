name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m py_compile pipeline.py model.py model_v07.py model_v11.py model_v12.py daily_predictions.py market_comparison.py gameweek_rankings.py portfolio_manager.py history_logger.py closing_line_tracker.py backtest.py run_all.py app.py
      - name: Unit tests
        run: pytest -q
