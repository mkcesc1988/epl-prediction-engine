name: Daily EPL predictions

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily EPL predictions
        run: python daily_predictions.py

      - name: Upload daily predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-epl-predictions
          path: |
            data/processed/daily_predictions_*.csv
            data/processed/daily_predictions_latest.csv
          if-no-files-found: warn
          retention-days: 30
