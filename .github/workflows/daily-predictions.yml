name: Daily EPL predictions

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

concurrency:
  group: epl-data-publisher
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate daily EPL predictions
        run: python daily_predictions.py

      - name: Publish daily predictions
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/daily_predictions_latest.csv
          if git diff --cached --quiet; then
            echo "No daily prediction changes to publish"
          else
            git commit -m "data: publish daily EPL predictions [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi

      - name: Upload daily predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-epl-predictions
          path: |
            data/processed/daily_predictions_*.csv
            data/processed/daily_predictions_latest.csv
          if-no-files-found: warn
          retention-days: 30
