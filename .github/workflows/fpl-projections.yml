name: FPL projections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fpl-projections.yml'
      - 'fpl_projections.py'
      - 'model_v12.py'
      - 'config.yaml'
  pull_request:
    paths:
      - '.github/workflows/fpl-projections.yml'
      - 'fpl_projections.py'
  workflow_dispatch:
  schedule:
    # Daily, an hour after the daily predictions job (UTC).
    - cron: '0 13 * * *'

permissions:
  contents: write

concurrency:
  group: fpl-projections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build FPL projections and squad plan
        run: python fpl_projections.py

      - name: Upload FPL outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-projections
          path: |
            data/processed/fpl_player_projections_latest.csv
            data/processed/fpl_transfer_options_latest.csv
            data/processed/fpl_squad_report_latest.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish outputs to main
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/fpl_player_projections_latest.csv
          git add -f data/processed/fpl_transfer_options_latest.csv
          git add -f data/processed/fpl_squad_report_latest.md
          if git diff --cached --quiet; then
            echo "No FPL output changes."
          else
            git commit -m "data: publish latest FPL projections [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
