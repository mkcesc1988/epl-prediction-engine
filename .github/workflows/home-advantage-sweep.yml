name: Home advantage sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt tabulate

      - name: Run multi-season home advantage sweep
        run: python home_advantage_sweep.py

      - name: Upload sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-advantage-sweep
          path: data/processed/home_advantage_sweep_*.csv
          if-no-files-found: warn
          retention-days: 30
