name: League predictions (La Liga, Bundesliga, Serie A, Ligue 1)

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: 'Space-separated league codes (blank = all enabled): LALIGA BUNDESLIGA SERIEA LIGUE1'
        required: false
        default: ''
      backtest:
        description: 'Also run walk-forward backtests (slower)'
        type: boolean
        default: false
      odds:
        description: 'Force an Odds API pull now (default: only when a fixture is within 2 days)'
        type: boolean
        default: false
  schedule:
    - cron: '30 12 * * *'

permissions:
  contents: write

concurrency:
  group: league-predictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate league predictions
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          THE_ODDS_API_LIVE: 'true'
          LEAGUES: ${{ github.event.inputs.leagues }}
          BACKTEST: ${{ github.event.inputs.backtest }}
          ODDS: ${{ github.event.inputs.odds }}
        run: |
          args=()
          for code in $LEAGUES; do args+=(--league "$code"); done
          if [ "$BACKTEST" = "true" ]; then args+=(--backtest); fi
          if [ "$ODDS" = "true" ]; then args+=(--odds); fi
          python league_predictions.py "${args[@]}"

      - name: Upload league outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: league-predictions
          path: |
            data/processed/leagues/**/*.csv
            data/processed/leagues/**/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish league outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          files=(data/processed/leagues/all_leagues_predictions_latest.csv
                 data/processed/leagues/all_leagues_paper_portfolio_latest.csv
                 data/history/leagues/*.csv)
          for dir in data/processed/leagues/*/; do
            for f in daily_predictions_latest.csv market_comparison_latest.csv moneyline_comparison_latest.csv \
                     validation_report.json backtest_summary_v12.csv home_advantage_sweep_summary.csv \
                     rankings_latest.csv paper_portfolio_latest.csv extreme_edge_audit_latest.csv; do
              if [ -f "$dir$f" ]; then files+=("$dir$f"); fi
            done
          done
          git add -f "${files[@]}"

          if git diff --cached --quiet; then
            echo "No league output changes to commit"
          else
            git commit -m "data: publish latest league predictions [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
