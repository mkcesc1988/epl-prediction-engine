name: EPL market comparison

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-comparison.yml'
      - 'market_comparison.py'
      - 'safe_market_comparison.py'
      - 'config.yaml'
      - 'api_football_odds_fallback.py'
      - 'gameweek_rankings.py'
      - 'pre_kickoff_adjustment.py'
      - 'decision_focus.py'
      - 'prepare_manual_mybookie.py'
      - 'data/manual_mybookie_odds*.csv'
      - 'data/manual_availability_adjustments.csv'
  workflow_dispatch:
  schedule:
    # Weekend/Friday/Monday EPL windows, hourly (UTC).
    - cron: '0 10-23 * * 0,1,5,6'
    # Midweek EPL windows, hourly (UTC).
    - cron: '0 17-23 * * 2-4'
    # One additional daytime refresh on Tue-Thu.
    - cron: '0 13 * * 2-4'

concurrency:
  group: epl-data-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate model-market comparison
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_LIVE: 'true'
        run: |
          python prepare_manual_mybookie.py
          python safe_market_comparison.py
          python api_football_odds_fallback.py

      - name: Rank MyBookie gameweek markets
        run: python gameweek_rankings.py

      - name: Generate V2.3 shadow context for agreement gate
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v2_shadow_predictions.py

      - name: Build pre-kickoff adjusted shadow probabilities
        run: python pre_kickoff_adjustment.py

      - name: Build focused decision layer
        run: python decision_focus.py

      - name: Build conservative paper portfolio
        run: python safe_portfolio_manager.py

      - name: Apply historical moneyline calibration sizing
        run: python portfolio_calibration_gate.py

      - name: Append permanent live-history snapshot
        run: python history_logger.py

      - name: Build closing-line report
        run: python closing_line_tracker.py

      - name: Update automatic paper-bet ledger and analytics
        run: |
          python bet_tracker.py
          python parlay_tracker.py
          python fixture_lifecycle_guard.py

      - name: Update separate real-money execution ledger
        run: python real_money_tracker.py

      - name: Apply verified manual exceptional results
        run: python manual_result_settler.py

      - name: Apply Football-Data EPL result fallback
        run: |
          if [ -f football_data_result_settler.py ]; then
            python football_data_result_settler.py
          fi

      - name: Reconcile settlements with independent result sources
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python settlement_guard.py

      - name: Rebuild analytics after settlement reconciliation
        run: |
          python bet_tracker.py
          python parlay_tracker.py
          python fixture_lifecycle_guard.py
          python real_money_tracker.py

      - name: Publish history and latest dashboard outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/history/*.csv
          git add -f data/processed/daily_predictions_latest.csv
          git add -f data/processed/market_odds_latest.csv
          git add -f data/processed/market_comparison_latest.csv
          git add -f data/processed/gameweek_rankings_latest.csv
          git add -f data/processed/v2_shadow_predictions_latest.csv
          git add -f data/processed/pre_kickoff_adjusted_latest.csv
          git add -f data/processed/decision_focus_latest.csv
          git add -f data/processed/v1_v2_agreement_audit_latest.csv
          git add -f data/processed/extreme_edge_audit_latest.csv
          git add -f data/processed/moneyline_calibration_gate_latest.csv
          git add -f data/processed/paper_portfolio_latest.csv

          if git diff --cached --quiet; then
            echo "No dashboard/history changes to commit"
          else
            git commit -m "data: publish latest EPL dashboard outputs [skip ci]"
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi

      - name: Validate current-gameweek market coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from pandas.errors import EmptyDataError

          pred_path = Path('data/processed/daily_predictions_latest.csv')
          odds_path = Path('data/processed/market_odds_latest.csv')
          rank_path = Path('data/processed/gameweek_rankings_latest.csv')

          preds = pd.read_csv(pred_path)
          if preds.empty:
              raise SystemExit('MARKET_HEALTH_FAIL: prediction file is empty')

          from pipeline import load_config

          now = pd.Timestamp.now(tz='UTC')
          kickoff = pd.to_datetime(preds.get('KickoffUTC'), utc=True, errors='coerce')
          upcoming_preds = preds.loc[kickoff.isna() | (kickoff > now)].copy()
          fixture_keys = set(zip(upcoming_preds['Date'].astype(str), upcoming_preds['HomeTeam'].astype(str), upcoming_preds['AwayTeam'].astype(str)))

          try:
              odds = pd.read_csv(odds_path)
          except EmptyDataError:
              odds = pd.DataFrame()

          current_odds = pd.DataFrame()
          if not odds.empty and {'Date','HomeTeam','AwayTeam'}.issubset(odds.columns):
              current_mask = [
                  (str(r.Date), str(r.HomeTeam), str(r.AwayTeam)) in fixture_keys
                  for r in odds[['Date','HomeTeam','AwayTeam']].itertuples(index=False)
              ]
              current_odds = odds.loc[current_mask].copy()

          current_mybookie = pd.DataFrame()
          fresh_mybookie = pd.DataFrame()
          if not current_odds.empty:
              title = current_odds.get('Bookmaker', pd.Series(index=current_odds.index, dtype=object)).astype(str).str.lower()
              key = current_odds.get('BookmakerKey', pd.Series(index=current_odds.index, dtype=object)).astype(str).str.lower()
              my_mask = title.str.contains('mybookie', na=False) | key.str.contains('mybookie', na=False)
              current_mybookie = current_odds.loc[my_mask].copy()

              last = pd.to_datetime(current_mybookie.get('BookLastUpdate'), utc=True, errors='coerce')
              captured = pd.to_datetime(current_mybookie.get('QuoteCapturedAt'), utc=True, errors='coerce')
              quote_time = last.fillna(captured)
              max_age = float(load_config().get('market_comparison', {}).get('executable_quote_max_age_minutes', 240))
              age = (now - quote_time).dt.total_seconds() / 60.0
              fresh_mybookie = current_mybookie.loc[quote_time.notna() & age.ge(-5.0) & age.le(max_age)].copy()

          try:
              rankings = pd.read_csv(rank_path)
          except EmptyDataError:
              rankings = pd.DataFrame()

          print(f'Upcoming prediction fixtures: {len(upcoming_preds)}')
          print(f'Current-gameweek market rows: {len(current_odds)}')
          print(f'Current-gameweek MyBookie rows: {len(current_mybookie)}')
          print(f'Fresh executable MyBookie rows: {len(fresh_mybookie)}')
          print(f'Ranked selections: {len(rankings)}')

          if current_odds.empty:
              raise SystemExit('MARKET_HEALTH_FAIL: predictions exist but there are zero current-gameweek market rows. Check live odds credentials or API-Football fallback coverage.')

          if rankings.empty and fresh_mybookie.empty:
              print('MARKET_HEALTH_WARN: the general market feed is healthy, but no fresh executable MyBookie price is available. Rankings remain empty by design.')
          elif rankings.empty:
              raise SystemExit('MARKET_HEALTH_FAIL: fresh current MyBookie prices exist but rankings are empty. This indicates a ranking/matching bug.')
          PY

      - name: Fail workflow if settlement integrity is not clean
        run: python settlement_guard.py --assert-clean

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-market-comparison
          path: |
            data/processed/daily_predictions_latest.csv
            data/processed/market_odds_latest.csv
            data/processed/market_comparison_latest.csv
            data/processed/gameweek_rankings_latest.csv
            data/processed/v2_shadow_predictions_latest.csv
            data/processed/pre_kickoff_adjusted_latest.csv
            data/processed/decision_focus_latest.csv
            data/processed/v1_v2_agreement_audit_latest.csv
            data/processed/extreme_edge_audit_latest.csv
            data/processed/moneyline_calibration_gate_latest.csv
            data/processed/paper_portfolio_latest.csv
            data/history/*.csv
          if-no-files-found: warn
          retention-days: 30
