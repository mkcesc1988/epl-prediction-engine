name: EPL market comparison

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate model-market comparison
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python market_comparison.py

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-market-comparison
          path: |
            data/processed/daily_predictions_latest.csv
            data/processed/market_odds_latest.csv
            data/processed/market_comparison_latest.csv
          if-no-files-found: warn
          retention-days: 30
