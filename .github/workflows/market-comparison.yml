name: EPL market comparison

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/history/**'
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
    - cron: '0 17 * * *'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate model-market comparison
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python market_comparison.py

      - name: Rank MyBookie gameweek markets
        run: python gameweek_rankings.py

      - name: Append permanent live-history snapshot
        run: python history_logger.py

      - name: Build closing-line report
        run: python closing_line_tracker.py

      - name: Commit history snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/*.csv
          if git diff --cached --quiet; then
            echo "No history changes to commit"
          else
            git commit -m "data: append live EPL market snapshot [skip ci]"
            git push
          fi

      - name: Upload comparison outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-market-comparison
          path: |
            data/processed/daily_predictions_latest.csv
            data/processed/market_odds_latest.csv
            data/processed/market_comparison_latest.csv
            data/processed/gameweek_rankings_latest.csv
            data/history/*.csv
          if-no-files-found: warn
          retention-days: 30
