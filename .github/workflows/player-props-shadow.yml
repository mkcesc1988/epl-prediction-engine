name: Player props shadow

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 2'

permissions:
  contents: write

jobs:
  build-player-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch historical Understat player data
        run: python understat_player_ingest.py --start-season 2021 --end-season 2025

      - name: Build leakage-safe player features
        run: python player_stats_pipeline.py

      - name: Run player props shadow board if input lines exist
        run: python player_props_shadow.py

      - name: Upload player-props research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-props-shadow
          path: |
            data/raw/player_match_stats.csv
            data/processed/player_match_stats.csv
            data/processed/player_form_features.csv
            data/processed/player_props_shadow_latest.csv
          if-no-files-found: warn
          retention-days: 30
