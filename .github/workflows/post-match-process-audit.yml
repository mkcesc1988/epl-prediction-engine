name: EPL post-match process audit

on:
  workflow_dispatch:
  schedule:
    - cron: '15 18-23 * * *'
    - cron: '15 0 * * *'

concurrency:
  group: epl-data-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull finished-match stats and compare with V1.2
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python post_match_process_audit.py

      - name: Publish process audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/post_match_process_latest.csv || true
          git add data/history/post_match_process_history.csv || true
          if git diff --cached --quiet; then
            echo "No post-match audit changes to publish"
          else
            git commit -m "data: update post-match process audit [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-match-process-audit
          path: |
            data/processed/post_match_process_latest.csv
            data/history/post_match_process_history.csv
          if-no-files-found: warn
          retention-days: 14
