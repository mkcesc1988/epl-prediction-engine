name: Run EPL model

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1'

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run complete pipeline and backtest
        run: python run_all.py

      - name: Publish underdog audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/underdog_bias_summary_v12.csv
          git add -f data/processed/underdog_bias_detail_v12.csv
          if git diff --cached --quiet; then
            echo "No underdog audit changes to commit"
          else
            git commit -m "data: publish V1.2 underdog bias audit [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi

      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epl-model-outputs
          path: |
            data/processed/*.csv
            data/processed/*.json
          if-no-files-found: warn
          retention-days: 30
