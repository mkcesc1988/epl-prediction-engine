name: UCL predictions

on:
  workflow_dispatch:
  push:
    branches: [feature/ucl-predictions]
    paths: ['ucl_predictions.py', 'data/manual_ucl_mybookie_odds.csv', '.github/workflows/ucl-predictions.yml']

permissions:
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Predict UCL games and screen MyBookie lines
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data/processed/ucl
          set -o pipefail
          python ucl_predictions.py 2>&1 | tee data/processed/ucl/run_log.txt
      - name: Publish UCL outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/ucl/*
          if git diff --cached --quiet; then
            echo "No UCL output changes"
          else
            git commit -m "data: publish UCL predictions [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase -X theirs "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
