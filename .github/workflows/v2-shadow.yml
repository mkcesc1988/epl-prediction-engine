name: V2 shadow predictions

on:
  workflow_dispatch:
  schedule:
    - cron: '30 10 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-shadow.yml'

permissions:
  contents: write

concurrency:
  group: epl-v2-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if python -m pip install --index-url https://pypi.org/simple --timeout 60 --retries 5 -r requirements.txt; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "PyPI install failed; waiting before retry..."
              sleep $((attempt * 15))
            fi
          done
          echo "Dependency installation failed after 3 attempts"
          exit 1

      - name: Run V2 shadow predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python v2_shadow_predictions.py

      - name: Publish V2 shadow output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/v2_shadow_predictions_latest.csv
          if git diff --cached --quiet; then
            echo "No V2 shadow changes to commit"
          else
            git commit -m "data: publish V2 shadow predictions [skip ci]"
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi

      - name: Upload V2 shadow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-shadow-predictions
          path: data/processed/v2_shadow_predictions_latest.csv
          if-no-files-found: warn
          retention-days: 30
