name: zz diagnose failing jobs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: Run failing steps and capture output
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          THE_ODDS_API_LIVE: 'true'
        run: |
          mkdir -p diag
          for s in prepare_manual_mybookie.py safe_market_comparison.py api_football_odds_fallback.py post_match_process_audit.py; do
            echo "### $s" >> diag/out.txt
            python $s >> diag/out.txt 2>&1; echo "exit=$?" >> diag/out.txt
          done
          sed -i -E 's/(apiKey=|x-apisports-key[^A-Za-z0-9]*)[A-Za-z0-9]+/\1REDACTED/g' diag/out.txt
      - name: Push output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B diag/output
          git add -f diag/out.txt
          git commit -m "diag output [skip ci]"
          git push -f origin diag/output
