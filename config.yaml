league: EPL
football_data_division: E0
start_season: 2021
end_season: 2025

model:
  venue_window: 20
  min_venue_matches: 5
  lambda_floor: 0.15
  lambda_cap: 4.5

model_v07:
  half_life_days: 180
  venue_window: 30
  overall_window: 60
  league_window: 760
  min_matches: 5
  shrinkage_matches: 10

model_v11:
  max_goal: 10
  rho_history_window: 760
  rho_min_matches: 200
  rho_fallback: -0.08
  rho_grid_min: -0.20
  rho_grid_max: 0.05
  rho_grid_step: 0.005

model_v12:
  half_life_days: 365
  fit_window_matches: 1140
  min_history_matches: 200
  regularization: 0.20
  # Fraction of the fitted home advantage to remove (0 = off, 1 = none).
  # 0.15 had the best multi-season RPS in home_advantage_sweep (2023-26) and
  # cuts the home-win over-prediction (model 45.7% vs actual 43.2%).
  home_advantage_shrink: 0.15
  # Promoted-team prior: promoted sides shrink toward the historical
  # promoted-team rating (estimated leakage-safe from past seasons when
  # promoted_prior_auto is true) instead of the league average (0).
  promoted_prior_enabled: true
  promoted_prior_auto: true
  promoted_prior_attack: -0.20     # fallback when history is too short
  promoted_prior_defense: -0.20    # fallback (higher = concedes less)
  promoted_prior_matches: 8        # prior strength in pseudo-matches
  promoted_prior_min_team_seasons: 3
  lambda_floor: 0.15
  lambda_cap: 4.5
  max_goal: 10
  rho_window_matches: 760
  rho_min_matches: 200
  rho_fallback: -0.08
  rho_grid_min: -0.20
  rho_grid_max: 0.05
  rho_grid_step: 0.005
  # Put totals/BTTS into goal units with the recent goals-per-xG ratio
  # (see model_v12.goal_conversion_scale). Off for the EPL; on for Ligue 1.
  totals_goal_scale: false
  totals_goal_scale_half_life_days: 365
  totals_goal_scale_min_matches: 200

v2_shadow:
  rest_day_floor: 3
  rest_day_cap: 10
  rest_log_lambda_per_day: 0.015
  congestion_window_days: 14
  congestion_free_matches: 2
  congestion_log_lambda_per_extra_match: 0.020
  max_context_log_adjustment: 0.10
  preseason_enabled: true
  preseason_league_id: 667
  preseason_start_month_day: "06-15"
  preseason_end_month_day: "08-20"
  preseason_form_matches: 5
  preseason_goal_diff_log_lambda_per_goal: 0.018
  max_preseason_form_log_adjustment: 0.06
  preseason_goal_diff_cap: 3.0
  preseason_form_metric_cap: 2.0
  preseason_unknown_opponent_weight: 0.55
  preseason_known_opponent_weight_min: 0.75
  preseason_known_opponent_weight_max: 1.25
  preseason_opponent_power_scale: 0.35

daily:
  current_season: 2026
  horizon_days: 21
  next_gameweek_only: true

leagues:
  # Other big-five leagues run by league_predictions.py. Each league is fitted
  # on its own history and writes to data/processed/leagues/<CODE>/; the EPL
  # pipeline and files above are unchanged. Codes: LALIGA, BUNDESLIGA, SERIEA, LIGUE1.
  enabled: [LALIGA, BUNDESLIGA, SERIEA, LIGUE1]
  horizon_days: 7          # predict every fixture kicking off in the next N days
  # Pull The Odds API prices when THE_ODDS_API_KEY is set, but only on days with
  # a fixture inside odds_within_days, to save credits (about 3 credits per
  # league per pull when the regional feed already includes MyBookie, else 6).
  # `--odds` forces a pull, `--no-odds` skips it.
  fetch_odds: true
  odds_within_days: 2
  # Applied to every league above; leagues.overrides wins over these.
  defaults:
    portfolio:
      # Each league gets half the EPL's exposure cap while it builds a track
      # record; open bets already in the league ledger count against it.
      max_gameweek_exposure_pct: 0.04
  # Per-league overrides of any section above. Evidence for these is in the
  # 2023/24-2025/26 walk-forward backtest against Pinnacle closing prices:
  # - LIGUE1: goals ran ~9% below xG since 2022, so totals were biased high.
  #   Goal-scaling cut the O/U 2.5 Brier from 0.2461 to 0.2451 and turned the
  #   gated O/U record from +1.3% to +6.4% ROI.
  # - LALIGA / BUNDESLIGA: O/U bets passing the live decision gate lost 15% and
  #   11%, so totals stay ranked but are kept out of the paper portfolio.
  overrides:
    LIGUE1:
      model_v12:
        totals_goal_scale: true
    LALIGA:
      portfolio:
        blocked_markets: [Total]
    BUNDESLIGA:
      portfolio:
        blocked_markets: [Total]

market_comparison:
  odds_api_sport: soccer_epl
  regions: us
  markets: h2h,spreads,totals
  mybookie_bookmaker_key: mybookieag
  # Odds API credit savers: skip the MyBookie-only request when the regional
  # feed already carries MyBookie, and only pull live odds when a fixture
  # kicks off within this many days.
  mybookie_direct_only_if_missing: true
  odds_within_days: 2
  executable_quote_max_age_minutes: 240

decision:
  market_anchor_enabled: true
  # Moneyline: walk-forward fit of outcome ~ model + market gave the model
  # ~0 weight beyond the no-vig market, so lean heavily on the market until
  # the model proves closing-line value.
  market_anchor_weight_moneyline: 0.85
  market_anchor_weight_spread: 0.40
  market_anchor_weight_total: 0.35
  min_consensus_books: 2
  no_bet_edge: 0.03
  bet_eligible_edge: 0.05
  max_raw_model_market_gap: 0.18
  # Early-season extra market anchoring (fades to 0 after this many GWs).
  early_season_gameweeks: 8
  early_season_anchor_bonus: 0.15

ranking:
  primary_book: mybookie
  min_expected_return: 0.00
  confidence_probability_weight: 0.65
  confidence_edge_weight: 0.35
  overall_confidence_weight: 0.55
  overall_profitability_weight: 0.45
  profitability_full_score_ev: 0.15

portfolio:
  paper_bankroll: 100.0
  unit_size_pct: 0.01
  fractional_kelly: 0.25
  max_stake_pct: 0.02
  max_gameweek_exposure_pct: 0.08
  max_same_match_exposure_pct: 0.03
  min_bet_quality: 60.0
  min_expected_return: 0.02
  min_stake_units: 0.25
  require_v2_agreement: true
  v2_min_expected_return: 0.00
  v2_max_probability_gap: 0.10
  extreme_edge_threshold: 0.25
  extreme_max_v1_v2_probability_gap: 0.03
  extreme_min_consensus_books: 3
  extreme_max_model_consensus_probability_gap: 0.18
  extreme_max_mybookie_price_deviation_pct: 0.20
  ml_bucket_mult_100_149: 0.0
  ml_bucket_mult_150_199: 1.0
  ml_bucket_mult_200_299: 0.5
  ml_bucket_mult_300_plus: 0.0

backtest:
  min_prior_seasons_for_calibration: 2
  ev_thresholds: [0.00, 0.02, 0.05, 0.075, 0.10]

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  master: data/processed/master_matches.csv
  predictions: data/processed/xg_predictions.csv
  predictions_v07: data/processed/xg_predictions_v07.csv
  predictions_v11: data/processed/xg_predictions_v11.csv
  predictions_v12: data/processed/xg_predictions_v12.csv
  summary: data/processed/backtest_summary.csv
  summary_v07: data/processed/backtest_summary_v07.csv
  summary_v11: data/processed/backtest_summary_v11.csv
  summary_v12: data/processed/backtest_summary_v12.csv
  comparison: data/processed/model_comparison.csv
  comparison_v11: data/processed/model_comparison_v11.csv
  comparison_v12: data/processed/model_comparison_v12.csv
  validation: data/processed/validation_report.json

home_advantage_sweep:
  shrink_grid: [0.0, 0.15, 0.3, 0.45, 0.6]
  # Seasons to score (all earlier seasons are still used as training history).
  eval_last_n_seasons: 3

fpl:
  # Fantasy Premier League team to plan for (public team ID from the FPL site).
  team_id: 4414893
  horizon_gameweeks: 3   # gameweeks ahead to value transfers over
  horizon_decay: 0.9     # weight on each later gameweek (next GW = 1.0)
  recent_form_decay: 0.75 # weight per gameweek back when judging who starts (latest = 1.0)
